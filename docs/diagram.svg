<text x="130.0" y="257.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">GET /tasks</text>
<text x="130.0" y="276.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">latest 50</text>
<text x="480.0" y="257.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">GET /tasks/:id/events (SSE)</text>
<text x="480.0" y="276.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">onSnapshot on one task doc</text>
<text x="5" y="399.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">Firestore · tasks (one doc per task)</text>
<text x="5" y="418.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• id, prompt, status, error</text>
<text x="5" y="437.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• cost: search / llm / total</text>
<text x="5" y="455.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• createdAt, startedAt,finishedAt</text>
<text x="5" y="474.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• events[]: every plan / search / reflect / write step</text>
<text x="5" y="493.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• messages[]: steering</text>
<text x="5" y="512.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• report, sources</text>
<text x="310.0" y="687.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">POST /internal/run/:id (Cloud Tasks)</text>
<text x="310.0" y="706.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">plan → search → reflect → write</text>
<text x="890.0" y="123.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">Sidebar (task list)</text>
<text x="1240.0" y="113.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">Task view</text>
<text x="1240.0" y="132.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">worklog, report</text>
<text x="1070.0" y="257.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">GET /stream (SSE), one per browser</text>
<text x="1070.0" y="276.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">onSnapshot on the events of my tasks</text>
<text x="765" y="399.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">Firestore : Tasks (status only)</text>
<text x="765" y="418.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• id, prompt, status</text>
<text x="765" y="437.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• cost, timestamps</text>
<text x="765" y="455.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• parentId: task it resumes</text>
<text x="1095" y="399.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">Firestore: Events</text>
<text x="1095" y="418.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">one doc per event</text>
<text x="1095" y="437.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• taskId, userId, seq</text>
<text x="1095" y="455.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• type,data, at</text>
<text x="1095" y="474.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="start" opacity="1.0" xml:space="preserve">• status changes (new)</text>
<text x="1070.0" y="687.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">POST /internal/run/:id (Cloud Tasks)</text>
<text x="1070.0" y="706.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">status → tasks, each step → events</text>
<text x="1070.0" y="824.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">Timed out at 15 min? start a new task with parentId = the old task</text>
<text x="1070.0" y="843.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#212529" text-anchor="middle" opacity="1.0" xml:space="preserve">it reads the parent&#x27;s last notes and sources from events and continues</text>
<text x="140" y="178.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">poll every 4s</text>
<text x="140" y="330.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">query</text>
<text x="489.88" y="330.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">every change (onSnapshot)</text>
<text x="490" y="178.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">whole task doc</text>
<text x="337.8372748096273" y="629.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">one request with lifetime (15-30m)</text>
<text x="900.2" y="178.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">status events</text>
<text x="1249.88" y="178.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">events of the open task</text>
<text x="1245" y="330.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">new events (onSnapshot)</text>
<text x="915" y="330.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">initial list (once)</text>
<text x="915.08" y="612.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">status</text>
<text x="1244.92" y="612.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">each step</text>
<text x="1084.8558253946562" y="762.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="start" opacity="1.0" xml:space="preserve">resume</text>
